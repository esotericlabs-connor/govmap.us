name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CI only reads the repo; keep the job token read-only.
permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pin ruff so a new release can't silently enable new rules in the
      # selected categories (E/F/UP/B) and turn this job red on unchanged code.
      # Bump this to match your local `ruff --version` when you upgrade.
      - run: pip install ruff==0.16.3
      - run: ruff check .

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Bootstrap on dev without local commands or first deploying a manual
      # workflow to main. Upload the exact tree checked by this job below.
      - name: Install dependencies
        id: dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      # The same production build the deploy runs inside Docker, so a broken
      # build fails here instead of on the server. All API-backed pages are
      # force-dynamic, so no backend is needed at build time.
      - run: npm run build
      - name: Audit all dependencies (gate)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm audit --json > npm-audit.json
      - name: Upload lockfile and security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-security-${{ github.sha }}
          path: |
            frontend/package-lock.json
            frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 7
