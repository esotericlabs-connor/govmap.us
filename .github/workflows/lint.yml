name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pin ruff so a new release can't silently enable new rules in the
      # selected categories (E/F/UP/B) and turn this job red on unchanged code.
      # Bump this to match your local `ruff --version` when you upgrade.
      - run: pip install ruff==0.16.3
      - run: ruff check .

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      # No npm cache yet -- switch to `npm ci` + setup-node's cache option once a
      # frontend/package-lock.json is committed (run `npm install --package-lock-only`).
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
