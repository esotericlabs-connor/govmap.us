name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CI only reads the repo; keep the job token read-only.
permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Pin ruff so a new release can't silently enable new rules in the
      # selected categories (E/F/UP/B) and turn this job red on unchanged code.
      # Bump this to match your local `ruff --version` when you upgrade.
      - run: pip install ruff==0.16.3
      - run: ruff check .

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: govmap_ci
          POSTGRES_PASSWORD: ci-only-health-test
          POSTGRES_DB: govmap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govmap_ci -d govmap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://govmap_ci:ci-only-health-test@127.0.0.1:5432/govmap_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Two installs: requirements.txt is hash-locked, so a combined install
      # would make pip demand hashes for the unlocked test-only pins too.
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Known-vulnerability gate. The runtime audit reads the committed lock as-is
  # (every transitive package, no re-resolution), so it checks exactly what
  # the image installs, and fails if any entry is unpinned or unhashed.
  # --strict also fails on any package that couldn't be audited.
  # Also recompiles requirements.in into the lock, keeping the committed pins,
  # and uploads it, so the lock is only ever produced on Linux/Python 3.13
  # (the image's platform), never on a developer machine. After editing
  # requirements.in, commit that artifact as requirements.txt.
  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --strict --progress-spinner off --require-hashes --disable-pip -r requirements.txt
      - run: pip-audit --strict --progress-spinner off -r requirements-dev.txt
      - name: Compile the hash-locked requirements.txt
        id: lock
        if: ${{ !cancelled() }}
        run: |
          python -m venv "$RUNNER_TEMP/lock-venv"
          "$RUNNER_TEMP/lock-venv/bin/python" -m pip install --quiet pip==26.2 pip-tools==7.6.2
          "$RUNNER_TEMP/lock-venv/bin/pip-compile" --quiet --generate-hashes --allow-unsafe \
            --strip-extras --no-emit-index-url --output-file=requirements.txt requirements.in
          # Informational, not a gate: an index can add files to an existing
          # release, which changes the hash list without any action here.
          if ! git diff --quiet -- requirements.txt; then
            echo "::warning file=backend/requirements.txt::The committed lock differs from a fresh compile of requirements.in. Review the backend-lock-${GITHUB_SHA} artifact and commit it if the change is expected."
            git --no-pager diff --stat -- requirements.txt
          fi
      - name: Upload the compiled lock
        if: ${{ !cancelled() && steps.lock.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-lock-${{ github.sha }}
          path: backend/requirements.txt
          if-no-files-found: error
          retention-days: 7

  # The backend runs `alembic upgrade head` on every start, so the migration
  # chain is exercised against a real Postgres exactly as production runs it:
  # fresh upgrade, no drift between the models and the migrated schema, every
  # downgrade, and a clean re-upgrade.
  backend-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: govmap_ci
          POSTGRES_PASSWORD: ci-only-migration-test
          POSTGRES_DB: govmap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govmap_ci -d govmap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Migrate up, check drift, down to base, and up again
        run: |
          export DATABASE_URL="postgresql+asyncpg://govmap_ci:ci-only-migration-test@127.0.0.1:5432/govmap_ci"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

  # Builds the images that ship and fails on any high/critical
  # vulnerability that has a fix available. Grype runs from a digest-pinned
  # image against saved tarballs: no third-party action and no Docker socket
  # inside the scanner. A failure here means "bump the pinned base digest or
  # the affected package", not "suppress".
  images:
    runs-on: ubuntu-latest
    env:
      GRYPE_IMAGE: anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build images
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t govmap-backend:ci backend
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t govmap-frontend:ci frontend
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f backup/Dockerfile -t govmap-backup:ci .
          docker build -t govmap-postgres:ci database
      - name: Runtime images carry no package managers
        run: |
          docker run --rm --entrypoint sh govmap-backend:ci -c '! python -c "import pip" 2>/dev/null && ! python -c "import setuptools" 2>/dev/null'
          docker run --rm --entrypoint sh govmap-frontend:ci -c '! command -v npm && ! command -v npx && ! command -v yarn && ! command -v corepack'
          docker run --rm --entrypoint pgbackrest govmap-backup:ci --version
          docker run --rm --entrypoint pg_controldata govmap-backup:ci --version
          docker run --rm --entrypoint cat govmap-backup:ci /usr/local/share/govmap-recovery/source-commit.txt | grep -Fx "$GITHUB_SHA"
          docker run --rm --entrypoint pgbackrest govmap-postgres:ci --version
      - name: Database image keeps the official PostgreSQL 16 as its only server
        run: |
          docker run --rm --entrypoint postgres govmap-postgres:ci --version | grep -F '(PostgreSQL) 16.'
          docker run --rm --entrypoint sh govmap-postgres:ci -c '[ "$(find / -xdev -type f -name postgres | wc -l)" -eq 1 ]'
      - name: Save images for scanning
        run: |
          mkdir -p "$RUNNER_TEMP/scan" "$RUNNER_TEMP/grype-db"
          docker save -o "$RUNNER_TEMP/scan/backend.tar" govmap-backend:ci
          docker save -o "$RUNNER_TEMP/scan/frontend.tar" govmap-frontend:ci
          docker save -o "$RUNNER_TEMP/scan/backup.tar" govmap-backup:ci
          docker save -o "$RUNNER_TEMP/scan/postgres.tar" govmap-postgres:ci
      - name: Scan images (gate)
        run: |
          status=0
          for image in backend frontend backup postgres; do
            echo "::group::grype $image"
            docker run --rm \
              -e GRYPE_DB_CACHE_DIR=/grype-db \
              -e GRYPE_CHECK_FOR_APP_UPDATE=false \
              -v "$RUNNER_TEMP/grype-db:/grype-db" \
              -v "$RUNNER_TEMP/scan:/scan:ro" \
              "$GRYPE_IMAGE" "docker-archive:/scan/$image.tar" \
              --only-fixed --fail-on high || status=1
            echo "::endgroup::"
          done
          exit "$status"

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      # Bootstrap on dev without local commands or first deploying a manual
      # workflow to main. Upload the exact tree checked by this job below.
      - name: Install dependencies
        id: dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - name: Frontend unit regression tests
        run: node --test tests/health.test.mjs tests/safe-url.test.mjs tests/workspace-state.test.mjs tests/sections.test.mjs tests/theme.test.mjs tests/hemicycle.test.mjs tests/chart-scales.test.mjs tests/freshness.test.mjs tests/bill-progress.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      # The same production build the deploy runs inside Docker, so a broken
      # build fails here instead of on the server. All API-backed pages are
      # force-dynamic, so no backend is needed at build time.
      - run: npm run build
      - name: Standalone frontend health integration
        run: node --test tests/health.integration.mjs
      - name: Audit all dependencies (gate)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm audit --json > npm-audit.json
      - name: Upload lockfile and security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-security-${{ github.sha }}
          path: |
            frontend/package-lock.json
            frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 7
