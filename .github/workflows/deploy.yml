name: Deploy

# RETIRED legacy VM deploy. Production now deploys through the PaaS, the VM
# runner was removed from GitHub and this workflow is disabled there. It is kept
# only until the old VM is deleted (see README "Legacy VM tooling"). It no
# longer runs on push, so re-enabling it by mistake cannot auto-deploy. This
# repository is public: never register a self-hosted runner for it again.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys run at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # Normal deploys take 2-5 min; the data refresh is capped at 15 min inside
    # scripts/deploy.sh. Without this, GitHub's default is 6 hours.
    timeout-minutes: 30
    steps:
      - name: Run deploy script
        run: bash /opt/govmap/scripts/deploy.sh
