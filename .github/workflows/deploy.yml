name: Deploy

# Auto-deploy on push to main, executed by a self-hosted GitHub Actions runner
# installed on the govmap VM. The runner just invokes the repo's deploy script
# — the same one you'd run by hand — so there's a single deploy path. No SSH,
# no exposed ports.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # Normal deploys take 2-5 min; the data refresh is capped at 15 min inside
    # scripts/deploy.sh. Without this, GitHub's default is 6 hours.
    timeout-minutes: 30
    steps:
      - name: Run deploy script
        run: bash /opt/govmap/scripts/deploy.sh
