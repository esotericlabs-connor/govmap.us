services:
  postgres:
    # Pinned by digest (as in docker-compose.PaaS.yml); bump deliberately.
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: govmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: govmap
      # Dev default only. In production set POSTGRES_PASSWORD (and a matching
      # DATABASE_URL) in an .env file next to this compose file — never ship
      # the "govmap" default to a reachable host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govmap}
      POSTGRES_DB: govmap
    ports:
      # Bound to loopback only. Docker publishes ports by writing iptables
      # rules that BYPASS ufw, so a plain "5432:5432" would expose Postgres
      # to every interface regardless of firewall rules. The app reaches
      # Postgres over the compose network by service name, not this port;
      # this mapping is only for host-side tools (psql, alembic).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    container_name: govmap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://govmap:${POSTGRES_PASSWORD:-govmap}@postgres:5432/govmap
      CORS_ORIGINS: ${CORS_ORIGINS:-https://govmap.us,https://app.govmap.us}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      UPSTREAM_MAX_CONCURRENT_REQUESTS: ${UPSTREAM_MAX_CONCURRENT_REQUESTS:-4}
      CONGRESS_REQUESTS_PER_HOUR: ${CONGRESS_REQUESTS_PER_HOUR:-4500}
      FEC_REQUESTS_PER_HOUR: ${FEC_REQUESTS_PER_HOUR:-900}
      GOVINFO_REQUESTS_PER_HOUR: ${GOVINFO_REQUESTS_PER_HOUR:-600}
      # Optional: set these in the .env next to this file to unlock the
      # /internal/* ops endpoints. Left unset = those endpoints stay locked.
      INTERNAL_USER: ${INTERNAL_USER:-}
      INTERNAL_PASSWORD: ${INTERNAL_PASSWORD:-}
      # Optional pipeline-failure webhook + the Congress.gov API key (bills/votes).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY:-}
      # OpenFEC (api.data.gov) key for campaign finance. Like the key above, it
      # MUST be listed here to reach the container — a value in .env alone is
      # only used for ${...} substitution, not injected automatically.
      FEC_API_KEY: ${FEC_API_KEY:-}
      FEC_CYCLE: ${FEC_CYCLE:-2026}
      # HUD USPS ZIP→CD crosswalk token (must be listed here to reach the
      # container, same as the keys above). Free from huduser.gov.
      HUD_API_TOKEN: ${HUD_API_TOKEN:-}
      # Cloudflare Turnstile secret key for verifying bug-report submissions.
      # Must be listed here to reach the container (same as the keys above); a
      # value in .env alone is only used for ${...} substitution. Unset =
      # verification disabled (the form still works, origin + rate limits apply).
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Which Congress/session to track, and per-refresh caps for bills and
      # votes. Defaults are fine; override in .env to roll to the 120th/session 1
      # in Jan 2027 or to widen coverage.
      CONGRESS_NUMBER: ${CONGRESS_NUMBER:-119}
      CONGRESS_SESSION: ${CONGRESS_SESSION:-2}
      CONGRESS_GOV_BILL_LIMIT: ${CONGRESS_GOV_BILL_LIMIT:-250}
      # Outage bounds for the Congress.gov batch pulls: the bills pull's
      # wall-clock budget, and how many consecutive timeouts end any batch early.
      CONGRESS_GOV_BILLS_MAX_SECONDS: ${CONGRESS_GOV_BILLS_MAX_SECONDS:-600}
      CONGRESS_MAX_CONSECUTIVE_FAILURES: ${CONGRESS_MAX_CONSECUTIVE_FAILURES:-5}
      VOTES_LIMIT: ${VOTES_LIMIT:-100}
      # Hours a staged Voteview Senate pull (the fallback when senate.gov blocks
      # the official LIS XML) is reused before re-downloading.
      VOTEVIEW_MIN_REFETCH_HOURS: ${VOTEVIEW_MIN_REFETCH_HOURS:-6}
    ports:
      # Loopback only — for host-side tooling and the deploy health check.
      # The tunnel reaches this over the compose network at http://backend:8000.
      - "127.0.0.1:8000:8000"
    volumes:
      # Operator log + bug-report files (app.log, bug_reports.log). A NAMED
      # volume (not a bind mount): the backend runs as a non-root user, and a
      # named volume inherits /app/logs' appuser ownership from the image so it
      # stays writable — a root-owned bind mount would silently fail. Persists
      # across redeploys. Grab the files with `docker cp` or
      # `docker compose exec backend cat` (see docs/logs-and-bug-reports.md).
      - govmap-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        # Baked into the client bundle at build time (see frontend/Dockerfile).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.govmap.us}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.govmap.us}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-https://govmap.us}
        # Cloudflare Turnstile site key for the bug-report widget. Baked into
        # the client bundle at build time; unset = the widget is skipped and
        # the form still works (the backend verify is disabled to match).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: govmap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side rendering reaches the backend directly over the compose
      # network instead of hairpinning through the public API hostname.
      API_INTERNAL_URL: http://backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(7000)}).then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    ports:
      # Loopback only — for host-side tooling. The tunnel reaches this over the
      # compose network at http://frontend:3000.
      - "127.0.0.1:3000:3000"

  # Cloudflare Tunnel connector, run as part of the stack so `docker compose up`
  # brings the public site up too — no systemd unit or on-disk credentials.
  # Runs ONLY when CLOUDFLARE_TUNNEL_TOKEN is set (the `tunnel` profile, which
  # scripts/deploy.sh enables automatically when the token is present in .env).
  # This is a DASHBOARD-managed tunnel: create the tunnel and its Public
  # Hostnames in the Cloudflare Zero Trust dashboard, pointing them at the
  # in-network services — govmap.us & app.govmap.us -> http://frontend:3000,
  # api.govmap.us -> http://backend:8000. cloudflared shares the compose
  # network, so those service names resolve.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: govmap-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    # Token via environment, not argv, so it stays out of `ps` and `docker inspect` Args.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  govmap-logs:
