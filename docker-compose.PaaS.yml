# Deployment configuration. Mirrors docker-compose.yml (still used by the old VM), except:
# - no host ports: cloudflared reaches the frontend by service name on the
#   resource's private network, so nothing is published on the server;
# - no fixed container names; the deployment system manages container and volume names, so
#   separate dev/production resources on one server never collide;
# - cloudflared always runs and reads its token from the environment;
# - POSTGRES_PASSWORD and CLOUDFLARE_TUNNEL_TOKEN are required (no defaults).
#
# Only the frontend is published (tunnel route -> http://frontend:3000). Browser
# "/api/*" calls are proxied by the frontend to the backend over the private
# network, so NEXT_PUBLIC_API_URL defaults to the internal backend address
# (it's read at build time by the rewrite in frontend/next.config.mjs). Never
# set it to the site's own public hostname: "/api/*" would proxy to itself.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: govmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: govmap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://govmap:${POSTGRES_PASSWORD:?}@postgres:5432/govmap
      CORS_ORIGINS: ${CORS_ORIGINS:-https://govmap.us}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      UPSTREAM_MAX_CONCURRENT_REQUESTS: ${UPSTREAM_MAX_CONCURRENT_REQUESTS:-4}
      CONGRESS_REQUESTS_PER_HOUR: ${CONGRESS_REQUESTS_PER_HOUR:-4500}
      FEC_REQUESTS_PER_HOUR: ${FEC_REQUESTS_PER_HOUR:-900}
      GOVINFO_REQUESTS_PER_HOUR: ${GOVINFO_REQUESTS_PER_HOUR:-600}
      INTERNAL_USER: ${INTERNAL_USER:-}
      INTERNAL_PASSWORD: ${INTERNAL_PASSWORD:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      CONGRESS_GOV_API_KEY: ${CONGRESS_GOV_API_KEY:-}
      FEC_API_KEY: ${FEC_API_KEY:-}
      FEC_CYCLE: ${FEC_CYCLE:-2026}
      HUD_API_TOKEN: ${HUD_API_TOKEN:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CONGRESS_NUMBER: ${CONGRESS_NUMBER:-119}
      CONGRESS_SESSION: ${CONGRESS_SESSION:-2}
      CONGRESS_GOV_BILL_LIMIT: ${CONGRESS_GOV_BILL_LIMIT:-250}
      CONGRESS_GOV_BILLS_MAX_SECONDS: ${CONGRESS_GOV_BILLS_MAX_SECONDS:-600}
      CONGRESS_MAX_CONSECUTIVE_FAILURES: ${CONGRESS_MAX_CONSECUTIVE_FAILURES:-5}
      VOTES_LIMIT: ${VOTES_LIMIT:-100}
      VOTEVIEW_MIN_REFETCH_HOURS: ${VOTEVIEW_MIN_REFETCH_HOURS:-6}
    volumes:
      - govmap-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://govmap.us}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-https://govmap.us}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(7000)}).then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    depends_on:
      - frontend

  # Daily recovery bundle (see docs/backup-service.md). Idle unless
  # BACKUP_ENABLED=true. Writes to "backups" in this resource's own directory
  # on the host. The deployment platform rejects variables in volume sources,
  # and a relative source keeps each resource's backups separate. The
  # entrypoint adopts that directory when it is new (root-owned or empty)
  # and then drops to uid/gid 70, so no host setup is needed. A missing target
  # or a non-empty directory owned by anyone else fails every run with no
  # heartbeat.
  # No Docker socket, no secrets beyond the database password.
  backup:
    build: ./backup
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    # Only for the entrypoint's one-time chown and its drop to uid/gid 70;
    # the backup user holds no capabilities.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_TARGET: ${BACKUP_TARGET:-unconfigured}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-02:30}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
      - govmap-logs:/logs:ro

volumes:
  postgres-data:
  govmap-logs:
